<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
      :root {
        --primary-dark: #121c2d;
        --secondary-dark: #1a2a40;
        --accent-blue: #4a709c;
        --accent-hover: #38577a;
        --bg-light: #f4f7fa;
        --white: #ffffff;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-light);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .auth-container {
        background: var(--white);
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .auth-container h2 {
        color: var(--primary-dark);
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--primary-dark);
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .btn-primary {
        background: var(--accent-blue);
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .switch-link {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #666;
      }
      .switch-link a {
        color: var(--accent-blue);
        text-decoration: none;
        font-weight: 500;
      }
      #error-msg {
        color: red;
        margin-bottom: 15px;
        font-size: 0.9rem;
      }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Selamat Datang</h2>
        <div id="error-msg"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nama Pengguna (Username)</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi (Password)</label>
                <input type="password" id="password" required placeholder="Masukkan kata sandi">
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Masuk</button>
        </form>
        <div class="switch-link">
            Belum punya akun? <a href="/register.html">Daftar di sini</a>
        </div>
        <div class="switch-link" style="margin-top: 10px;">
            <a href="/">&larr; Kembali ke Beranda</a>
        </div>
    </div>
    
    <script type="module" src="/src/login.js"></script>
</body>
</html>
