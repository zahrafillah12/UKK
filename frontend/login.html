<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Smart Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="auth-body">
    <div class="glass-container">
        <!-- Left Panel -->
        <div class="auth-left">
            <div class="logo-icon"><i class='bx bx-buildings'></i></div>
            <h1>Welcome!</h1>
            <hr style="width: 50px; border: 1px solid white; margin-bottom: 30px;">
            <p>Silakan masuk untuk mengelola reservasi ruang kerja Anda. Kami siap memberikan pengalaman terbaik bagi produktivitas bisnis Anda.</p>
            <div>
                <a href="/register.html" class="btn-glass">Daftar Akun Baru</a>
            </div>
        </div>

        <!-- Right Panel (Form) -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2 id="form-title">Sign In Member</h2>
                
                <div class="auth-tabs">
                    <button type="button" class="active" id="tab-member">Member</button>
                    <button type="button" id="tab-admin">Admin Space</button>
                </div>

                <div id="error-msg" class="auth-msg"></div>
                <form id="login-form">
                    <div class="form-group-glass">
                        <label for="username">User Name</label>
                        <input type="text" id="username" required placeholder="Masukkan username">
                    </div>
                    <div class="form-group-glass">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-gradient" id="login-btn">Submit</button>
                </form>
                
                <div class="social-icons">
                    <i class='bx bxl-facebook'></i>
                    <i class='bx bxl-instagram'></i>
                    <i class='bx bxl-pinterest'></i>
                </div>
                <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: rgba(255,255,255,0.7);">
                    <a href="/">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/login.js"></script>
</body>
</html>
