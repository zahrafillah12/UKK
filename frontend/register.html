<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Smart Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/src/style.css">
    <style>
      .glass-container { max-width: 1000px; }
      .auth-form-box { max-width: 500px; padding: 30px; overflow-y: auto; max-height: 85vh; }
      .auth-form-box h2 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .form-group-glass { margin-bottom: 15px; }
      .full-width { grid-column: span 2; }
    </style>
</head>
<body class="auth-body">
    <div class="glass-container">
        <!-- Left Panel -->
        <div class="auth-left">
            <div class="logo-icon"><i class='bx bx-buildings'></i></div>
            <h1>Join Us!</h1>
            <hr style="width: 50px; border: 1px solid white; margin-bottom: 30px;">
            <p>Jadilah bagian dari komunitas profesional kami. Dapatkan akses eksklusif ke ruang kerja, ruang rapat, dan fasilitas premium lainnya dengan mendaftar hari ini.</p>
            <div style="margin-top: 20px;">
                <p style="font-size: 0.85rem; opacity: 0.7; margin-bottom: 10px;">Sudah memiliki akun?</p>
                <a href="/login.html" class="btn-glass">Masuk di Sini</a>
            </div>
        </div>

        <!-- Right Panel (Form) -->
        <div class="auth-right">
            <div class="auth-form-box">
                <h2 id="form-title">Register Member</h2>
                
                <div class="auth-tabs">
                    <button type="button" class="active" id="tab-member">Member</button>
                    <button type="button" id="tab-admin">Admin Space</button>
                </div>

                <div id="error-msg" class="auth-msg"></div>
                <div id="success-msg" class="auth-msg success"></div>
                
                <form id="register-form">
                    <div class="form-grid">
                        <div class="form-group-glass">
                            <label for="username">Username</label>
                            <input type="text" id="username" required placeholder="Masukkan username">
                        </div>
                        <div class="form-group-glass">
                            <label for="password">Password</label>
                            <input type="password" id="password" required placeholder="Min 6 karakter">
                        </div>
                        <div class="form-group-glass full-width">
                            <label for="telp">Telepon</label>
                            <input type="text" id="telp" required placeholder="08123...">
                        </div>
                        
                        <!-- Member Fields -->
                        <div id="member-fields" class="full-width form-grid" style="display: grid; gap: 15px;">
                            <div class="form-group-glass full-width">
                                <label for="nama_member">Nama Lengkap</label>
                                <input type="text" id="nama_member" required placeholder="Budi Santoso">
                            </div>
                            <div class="form-group-glass">
                                <label for="instansi">Instansi</label>
                                <input type="text" id="instansi" placeholder="PT Maju">
                            </div>
                            <div class="form-group-glass">
                                <label for="alamat">Alamat</label>
                                <input type="text" id="alamat" placeholder="Jl. Sudirman...">
                            </div>
                        </div>

                        <!-- Admin Space Fields -->
                        <div id="admin-fields" class="full-width form-grid" style="display: none; gap: 15px;">
                            <div class="form-group-glass full-width">
                                <label for="nama_coworking">Nama Coworking</label>
                                <input type="text" id="nama_coworking" placeholder="Space Center">
                            </div>
                            <div class="form-group-glass full-width">
                                <label for="nama_pemilik">Nama Pemilik / PIC</label>
                                <input type="text" id="nama_pemilik" placeholder="Budi Santoso">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-gradient" id="register-btn" style="margin-top: 20px;">Register Now</button>
                </form>
                
                <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: rgba(255,255,255,0.7);">
                    <a href="/">&larr; Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/register.js"></script>
</body>
</html>
